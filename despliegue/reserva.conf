# /etc/systemd/system/<servicio-anterior>.service.d/reserva.conf
# Un supervisor anterior queda de reserva: arranca solo si el controlador no esta activo (detenido, en
# failed o desinstalado) o si esta en modo observar, que no repara. Sirve para guardianes oneshot con
# timer y para bucles permanentes con timer de relanzamiento.
[Service]
ExecCondition=/bin/sh -c "! systemctl is-active --quiet controlador-radio.service || grep -qs '^modo = .observar' /etc/controlador-radio/config.toml"
