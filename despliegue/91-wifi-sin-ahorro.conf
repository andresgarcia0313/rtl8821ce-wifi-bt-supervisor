# /etc/tlp.d/91-wifi-sin-ahorro.conf - un servidor por wifi no entra en ahorro de energia de la radio.
# Con WIFI_PWR_ON_BAT=on (lo usual en portatiles) TLP activa power_save en cada cambio de fuente y le
# gana a NetworkManager (wifi.powersave=2). En rtw88 power_save activa el modo LPS: la tarjeta duerme
# entre balizas y cada paquete entrante espera la siguiente (latencia y perdidas). Ver docs/adr/0003.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off
