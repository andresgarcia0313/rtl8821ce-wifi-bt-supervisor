# /etc/NetworkManager/conf.d/80-anclaje-usb-respaldo.conf: cualquier anclaje USB de un celular entra como
# salida de respaldo (metrica 700; la wifi tiene 600), aunque Android cambie la MAC y la interfaz cambie de
# nombre. Se reconoce por el driver, no por el nombre enx<mac> (el enlace Bluetooth tambien se llama asi).
# Aplicar: nmcli general reload conf && nmcli connection up <perfil-del-cable>
[connection-anclaje-usb]
match-device=driver:rndis_host,driver:cdc_ether,driver:cdc_ncm,driver:ipheth
ipv4.route-metric=700
ipv6.route-metric=700
